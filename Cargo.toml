[package]
name = "rsmlc"
version = "0.1.0"
edition = "2024"

[lib]
name = "rsmlc"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.99"
base64 = "0.22.1"
gltf = "1.4.1"
image = "0.25.5"
stl_io = "0.8.5"
quick-xml = { version = "0.38.3", features = ["serialize"] }
rand = "0.9.2"
reqwest = { version = "0.12.23", default-features = false, features = [
    "rustls-tls",
    "blocking",
] } # 可以根据需要添加 features
serde = { version = "1.0.221", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.16"
toml = "0.9.5"

[dev-dependencies]
serde_json = "1.0"
serde_test = "1.0"
tempfile = "3.14.0"

[[bin]]
name = "rsmlc"
path = "src/main.rs"
